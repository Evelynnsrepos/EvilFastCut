# Push a tag like v0.1.0, or run this from Actions ▸ Release ▸ Run workflow, to build Evil Fast Cut
# for Windows, macOS (Intel and Apple chips), Linux and Flatpak and publish it as a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, exe: "" }
          - { os: windows-latest, name: windows, exe: .exe }
          - { os: macos-latest, name: macos, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release
        if: matrix.name != 'macos'
      - name: Universal macOS binary (Intel + Apple chips)
        if: matrix.name == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          for b in evil-fastcut evil-fastcut-gui; do
            lipo -create -output target/release/$b target/{x86_64,aarch64}-apple-darwin/release/$b
          done
      - run: |
          mkdir -p out
          cp target/release/evil-fastcut${{ matrix.exe }} out/
          if [ "${{ matrix.name }}" = macos ]; then
            app="out/Evil Fast Cut.app/Contents"
            mkdir -p "$app/MacOS"
            cp target/release/evil-fastcut-gui "$app/MacOS/"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Evil Fast Cut</string>
            <key>CFBundleExecutable</key><string>evil-fastcut-gui</string>
            <key>CFBundleIdentifier</key><string>io.github.evelynnsrepos.EvilFastCut</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          else
            cp target/release/evil-fastcut-gui${{ matrix.exe }} out/
          fi
          cd out
          # zip keeps the programs runnable on Mac and Linux; Windows has 7-Zip instead.
          if [ "${{ matrix.name }}" = windows ]; then 7z a ../evil-fastcut-windows.zip .; else zip -ry ../evil-fastcut-${{ matrix.name }}.zip .; fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "evil-fastcut-${{ matrix.name }}.zip" }
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: evil-fastcut.flatpak
          manifest-path: flatpak/io.github.evelynnsrepos.EvilFastCut.yml
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: evil-fastcut.flatpak }
  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: gh release create "$TAG" evil-fastcut-*.zip evil-fastcut.flatpak --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Evil Fast Cut $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
